
<canvas id="c" style="display:block;width:100%;background:#000;border-radius:12px;"></canvas>
<div id="controls" style="display:flex;gap:12px;flex-wrap:wrap;padding:12px 0 4px;">
  <button onclick="setRisk('optimal')" id="btn-optimal" style="flex:1;min-width:80px;padding:8px 0;border-radius:8px;border:1.5px solid #00ffaa;background:rgba(0,255,170,0.1);color:#00ffaa;font-size:13px;cursor:pointer;">Optimal</button>
  <button onclick="setRisk('elevated')" id="btn-elevated" style="flex:1;min-width:80px;padding:8px 0;border-radius:8px;border:1.5px solid #555;background:transparent;color:#888;font-size:13px;cursor:pointer;">Elevated Risk</button>
  <button onclick="setRisk('critical')" id="btn-critical" style="flex:1;min-width:80px;padding:8px 0;border-radius:8px;border:1.5px solid #555;background:transparent;color:#888;font-size:13px;cursor:pointer;">Critical Risk</button>
</div>
<div id="status" style="font-size:12px;color:#00ffaa;letter-spacing:2px;text-align:center;padding:4px 0 8px;font-family:monospace;">METABOLIC STATE: OPTIMAL</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 680, H = 480;
canvas.width = W; canvas.height = H;

const states = {
  optimal:  { color:[0,255,170],  pulse:0.015, chaos:0,    glow:0.4, label:'METABOLIC STATE: OPTIMAL',   speed:0.4  },
  elevated: { color:[255,180,0],  pulse:0.032, chaos:0.18, glow:0.6, label:'METABOLIC STATE: ELEVATED RISK', speed:0.7 },
  critical: { color:[255,50,80],  pulse:0.07,  chaos:0.44, glow:0.9, label:'METABOLIC STATE: CRITICAL RISK', speed:1.3 }
};

let current = states.optimal;
let target  = states.optimal;
let lerpT   = 1;

let colorL  = [...states.optimal.color];
let pulseL  = states.optimal.pulse;
let chaosL  = 0;
let glowL   = states.optimal.glow;
let speedL  = states.optimal.speed;

function lerp(a,b,t){ return a+(b-a)*t; }
function lerpArr(a,b,t){ return a.map((v,i)=>lerp(v,b[i],t)); }

function setRisk(key){
  target = states[key];
  lerpT = 0;
  document.getElementById('status').style.color = `rgb(${target.color.join(',')})`;
  document.getElementById('status').textContent = target.label;
  ['optimal','elevated','critical'].forEach(k=>{
    const btn = document.getElementById('btn-'+k);
    const s   = states[k];
    if(k===key){
      btn.style.borderColor = `rgb(${s.color.join(',')})`;
      btn.style.background  = `rgba(${s.color.join(',')},0.15)`;
      btn.style.color       = `rgb(${s.color.join(',')})`;
    } else {
      btn.style.borderColor='#555'; btn.style.background='transparent'; btn.style.color='#888';
    }
  });
}

const R = 160, LATS=18, LONS=28;
let t=0, noise=[];

for(let i=0;i<LATS*LONS;i++) noise.push((Math.random()-0.5)*2);

function project(x,y,z,cx,cy){
  const fov=420, zOff=600;
  const scale = fov/(fov+z+zOff);
  return [cx+x*scale, cy+y*scale, scale];
}

function spherePt(lat,lon,rx,ry,rz,time,chaos){
  const phi = (lat/LATS)*Math.PI;
  const theta=(lon/LONS)*Math.PI*2;
  const ni = (lat%LATS)*LONS+(lon%LONS);
  const n  = noise[ni];
  const distort = chaos>0 ? n*chaos*(18+12*Math.sin(time*2.1+ni*0.4)): 0;
  const r = R+distort;
  const x0= r*Math.sin(phi)*Math.cos(theta);
  const y0= r*Math.sin(phi)*Math.sin(theta);
  const z0= r*Math.cos(phi);
  const cx=Math.cos(rx), sx=Math.sin(rx);
  const cy=Math.cos(ry), sy=Math.sin(ry);
  const cz=Math.cos(rz), sz=Math.sin(rz);
  let x1=x0, y1=y0*cx-z0*sx, z1=y0*sx+z0*cx;
  let x2=x1*cy+z1*sy, y2=y1, z2=-x1*sy+z1*cy;
  let x3=x2*cz-y2*sz, y3=x2*sz+y2*cz, z3=z2;
  return [x3,y3,z3];
}

function draw(){
  t += 0.012;
  lerpT = Math.min(1, lerpT+0.025);
  const ease = lerpT<1 ? 1-(1-lerpT)*(1-lerpT)*(1-lerpT) : 1;

  colorL = lerpArr(colorL, target.color, ease*0.08);
  pulseL = lerp(pulseL, target.pulse, ease*0.06);
  chaosL = lerp(chaosL, target.chaos, ease*0.05);
  glowL  = lerp(glowL,  target.glow,  ease*0.06);
  speedL = lerp(speedL, target.speed, ease*0.06);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  const cx=W/2, cy=H/2;
  const rx=t*0.19*speedL, ry=t*0.27*speedL, rz=t*0.11*speedL;
  const pulseScale = 1+pulseL*Math.sin(t*4.5);
  const [r,g,b]=colorL.map(Math.round);

  const grid=[];
  for(let la=0;la<=LATS;la++){
    grid[la]=[];
    for(let lo=0;lo<=LONS;lo++){
      const [x,y,z]=spherePt(la,lo,rx,ry,rz,t,chaosL*pulseScale*30);
      const xs=x*pulseScale, ys=y*pulseScale, zs=z*pulseScale;
      const [px,py,sc]=project(xs,ys,zs,cx,cy);
      const brightness = Math.max(0,Math.min(1,(zs/R+1)/2));
      grid[la][lo]={px,py,sc,z:zs,b:brightness};
    }
  }

  const glowR = 110+40*Math.sin(t*3);
  const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,glowR);
  grd.addColorStop(0,`rgba(${r},${g},${b},${glowL*0.18})`);
  grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,glowR,0,Math.PI*2); ctx.fill();

  ctx.lineWidth=0.7;
  for(let la=0;la<LATS;la++){
    for(let lo=0;lo<LONS;lo++){
      const p0=grid[la][lo], p1=grid[la][lo+1], p2=grid[la+1][lo];
      const avgB=(p0.b+p1.b)/2;
      const alpha=0.15+avgB*0.72;
      ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;
      ctx.beginPath(); ctx.moveTo(p0.px,p0.py); ctx.lineTo(p1.px,p1.py); ctx.stroke();

      const avgB2=(p0.b+p2.b)/2;
      const alpha2=0.15+avgB2*0.72;
      ctx.strokeStyle=`rgba(${r},${g},${b},${alpha2})`;
      ctx.beginPath(); ctx.moveTo(p0.px,p0.py); ctx.lineTo(p2.px,p2.py); ctx.stroke();
    }
  }

  const nodes=[];
  const step=Math.max(2,Math.round(3-chaosL*1.5));
  for(let la=0;la<=LATS;la+=step){
    for(let lo=0;lo<LONS;lo+=step){
      nodes.push(grid[la][lo]);
    }
  }
  nodes.sort((a,b)=>a.z-b.z);
  nodes.forEach(n=>{
    if(n.b<0.3) return;
    const nr=2.5*n.sc*pulseScale*(0.8+0.4*Math.sin(t*5+n.px*0.05));
    const ng=ctx.createRadialGradient(n.px,n.py,0,n.px,n.py,nr*3);
    ng.addColorStop(0,`rgba(${r},${g},${b},${0.9*n.b})`);
    ng.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(n.px,n.py,nr*3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(${r},${g},${b},${n.b})`;
    ctx.beginPath(); ctx.arc(n.px,n.py,nr,0,Math.PI*2); ctx.fill();
  });

  if(chaosL>0.05){
    const numSpark=Math.floor(chaosL*8);
    for(let s=0;s<numSpark;s++){
      const la=Math.floor(Math.random()*LATS);
      const lo=Math.floor(Math.random()*LONS);
      const p=grid[la][lo];
      if(p.b<0.5) continue;
      const len=8+Math.random()*18;
      const ang=Math.random()*Math.PI*2;
      const alpha=0.3+Math.random()*0.5;
      ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth=0.5+Math.random();
      ctx.beginPath();
      ctx.moveTo(p.px,p.py);
      ctx.lineTo(p.px+Math.cos(ang)*len, p.py+Math.sin(ang)*len);
      ctx.stroke();
    }
  }

  ctx.shadowBlur=0;
  requestAnimationFrame(draw);
}
draw();
</script>
